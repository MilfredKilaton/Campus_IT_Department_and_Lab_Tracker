<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus IT Asset &amp; Lab Tracker</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="app-header">
        <h1>Campus IT Asset &amp; Lab Tracker</h1>
        <p>Manage workstations, peripherals, network hardware, and software licenses.</p>
    </header>

    <main>
        <section id="menu">
            <button class="card" data-view="add">
                <span class="icon">+</span>
                <h2>Add Asset</h2>
                <p>Register a new campus asset.</p>
            </button>
            <button class="card" data-view="list">
                <span class="icon">=</span>
                <h2>View All Assets</h2>
                <p>Browse every asset in the system.</p>
            </button>
            <button class="card" data-view="checkout">
                <span class="icon">&gt;</span>
                <h2>Check Out</h2>
                <p>Lend a borrowable asset.</p>
            </button>
            <button class="card" data-view="checkin">
                <span class="icon">&lt;</span>
                <h2>Check In</h2>
                <p>Return a checked-out asset.</p>
            </button>
            <button class="card" data-view="depreciation">
                <span class="icon">$</span>
                <h2>Depreciation</h2>
                <p>Total calculated depreciation.</p>
            </button>
            <button class="card" data-view="network">
                <span class="icon">#</span>
                <h2>Network Devices</h2>
                <p>Devices with IP and MAC addresses.</p>
            </button>
        </section>

        <section id="panel">
            <div class="panel-header">
                <h2 id="panel-title">Select an Option</h2>
            </div>
            
            <div id="panel-body">
                <div id="view-default" class="empty view-panel">Choose an action from the menu on the left.</div>

                <section id="view-add" class="view-panel" hidden>
                    <form id="form-add">
                        <div class="form-group">
                            <label>Asset Type</label>
                            <select id="add-type">
                                <option value="WorkStation">WorkStation</option>
                                <option value="NetworkingHardware">NetworkingHardware</option>
                                <option value="Peripheral">Peripheral</option>
                                <option value="SoftwareLicense">SoftwareLicense</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Asset Tag</label>
                                <input id="add-tag" placeholder="e.g. WS-001" required />
                            </div>
                            <div class="form-group">
                                <label>Asset Name</label>
                                <input id="add-name" placeholder="e.g. Dell Latitude 3310" required />
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Purchase Price</label>
                                <input id="add-price" type="number" placeholder="1500.00" required />
                            </div>
                        </div>
                        <div class="form-row" id="row-network">
                            <div class="form-group">
                                <label>IP Address</label>
                                <input id="add-ip" placeholder="192.168.1.10" />
                            </div>
                            <div class="form-group">
                                <label>MAC Address</label>
                                <input id="add-mac" placeholder="AA:BB:CC:DD:EE:FF" />
                            </div>
                        </div>
                        <div class="form-row" id="row-license" style="display: none;">
                            <div class="form-group">
                                <label>Remaining Months</label>
                                <input id="add-months" type="number" placeholder="12" value="12" />
                            </div>
                        </div>
                        <button type="submit" id="btn-addAsset" class="btn-primary action-btn">Add Asset</button>
                    </form>
                </section>

                <section id="view-list" class="view-panel" hidden>
                    <table>
                        <thead>
                            <tr>
                                <th>Asset Tag</th>
                                <th>Name</th>
                                <th>Type</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="list-body"></tbody>
                    </table>
                </section>

                <section id="view-checkout" class="view-panel" hidden>
                    <form id="form-checkout">
                        <div class="form-group">
                            <label>Select Available Asset</label>
                            <select id="checkout-tag" required>
                                <option value="" disabled selected>-- Select an asset --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Borrower ID</label>
                            <input id="checkout-borrower" placeholder="e.g. STU-2024-05" required />
                        </div>
                        <button type="submit" id="btn-checkout" class="btn-primary action-btn">Check Out</button>
                    </form>
                </section>

                <section id="view-checkin" class="view-panel" hidden>
                    <form id="form-checkin">
                        <div class="form-group">
                            <label>Select Checked-Out Asset</label>
                            <select id="checkin-tag" required>
                                <option value="" disabled selected>-- Select an asset --</option>
                            </select>
                        </div>
                        <button type="submit" id="btn-checkin" class="btn-primary action-btn">Check In</button>
                    </form>
                </section>

                <section id="view-depreciation" class="view-panel" hidden>
                    <div class="big-number">
                        <div class="label">Total Depreciation Across All Assets</div>
                        <div class="value" id="depreciation-value">0.00</div>
                    </div>
                </section>

                <section id="view-network" class="view-panel" hidden>
                    <table>
                        <thead>
                            <tr>
                                <th>Asset Tag</th>
                                <th>IP Address</th>
                                <th>MAC Address</th>
                            </tr>
                        </thead>
                        <tbody id="network-body"></tbody>
                    </table>
                </section>
            </div>
        </section>
    </main>

    <!-- TEMPLATE FOR ASSET ROW -->
    <template id="asset-row-template">
        <tr>
            <td class="cell-tag"></td>
            <td class="cell-name"></td>
            <td class="cell-type"></td>
            <td class="cell-price"></td>
            <td><span class="badge cell-status"></span></td>
            <td>
                <button class="btn-edit" style="background: transparent; border: 1px solid #38bdf8; color: #38bdf8; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; margin-right: 8px;">
                    Edit
                </button>
                <button class="btn-delete" style="background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600;">
                    Delete
                </button>
            </td>
        </tr>
    </template>

    <!-- EDIT MODAL -->
    <div id="edit-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 1000;">
        <div style="background: #1e293b; padding: 24px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #334155;">
            <h2 style="margin-bottom: 16px; color: #e2e8f0;">Edit Asset</h2>
            
            <form id="form-edit">
                <input type="hidden" id="edit-tag" />
                
                <div class="form-group">
                    <label>Asset Name</label>
                    <input id="edit-name" required />
                </div>
                <div class="form-group">
                    <label>Purchase Price</label>
                    <input id="edit-price" type="number" step="0.01" required />
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="edit-status">
                        <option value="Available">Available</option>
                        <option value="InRepair">InRepair</option>
                    </select>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px;">
                    <button type="button" id="btn-cancel-edit" style="background: transparent; border: 1px solid #334155; color: #e2e8f0; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Cancel</button>
                    <button type="submit" style="background: #38bdf8; border: none; color: #0f172a; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
